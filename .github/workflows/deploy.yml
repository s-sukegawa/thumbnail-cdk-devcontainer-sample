name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stage: [dev, stg]
    permissions:
      id-token: write
      contents: read
    environment: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.stage == 'dev' && vars.AWS_ROLE_ARN_DEV || vars.AWS_ROLE_ARN_STG }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      - run: npm run cdk -- bootstrap
      - run: npm run cdk -- deploy --require-approval never -c stage=${{ matrix.stage }}
