name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-synth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run synth -- -c stage=dev
