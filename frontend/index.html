<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PNG Thumbnail Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>PNG Thumbnail Generator</h1>
      <p>PNGを選択してアップロードし、Lambda Function URLでサムネイルを作成します。</p>
      <input id="fileInput" type="file" accept="image/png" />
      <button id="runButton">アップロードしてサムネ化</button>
      <pre id="status"></pre>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
